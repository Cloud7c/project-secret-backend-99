<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Zim AutoAgri</title>
    <!-- We will use a new register.css file for this page! -->
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- We use the same container structure as login -->
    <main class="login-container">
        
        <!-- The White Floating Card (slightly wider to fit more data cleanly) -->
        <div class="login-card register-card">
            
            <!-- Logo Section -->
            <div class="brand-header">
                <div class="logo-lockup">
                    <img src="logo.png" alt="Zim AutoAgri Logo" class="logo-img">
                    <h2>Zim AutoAgri</h2>
                </div>
            </div>

            <!-- Welcome Text -->
            <div class="welcome-text">
                <h1>Create Your Zim AutoAgri Account</h1>
                <p>Register for the leading enterprise agricultural marketplace</p>
            </div>

            <!-- The Registration Form -->
            <form id="register-form">
                
                <!-- Full Name -->
                <div class="premium-input-group">
                    <i class="fa-regular fa-user input-icon"></i>
                    <div class="input-content">
                        <!-- Notice how clean this is: No label, just an input! -->
                        <input type="text" id="fullname" placeholder="Full Name" required>
                    </div>
                </div>

                <!-- Business Email -->
                <div class="premium-input-group">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <div class="input-content">
                        <input type="email" id="email" placeholder="Business Email Address" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="premium-input-group">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <div class="input-content">
                        <input type="tel" id="phone" placeholder="Phone Number" required>
                    </div>
                </div>

                <!-- Company Name (Optional) -->
                <div class="premium-input-group">
                    <i class="fa-regular fa-building input-icon"></i>
                    <div class="input-content">
                        <input type="text" id="company" placeholder="Company Name">
                    </div>
                </div>

                <!-- Farm/Business Address -->
                <div class="premium-input-group">
                    <i class="fa-solid fa-location-dot input-icon"></i>
                    <div class="input-content">
                        <input type="text" id="address" placeholder="Farm/Business Address" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="premium-input-group password-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <div class="input-content">
                        <input type="password" id="password-input" placeholder="Password" required>
                    </div>
                    <!-- Eye Icon for Hide/Show like the mockup -->
                    <button type="button" class="toggle-password" id="toggle-password">
                        <i class="fa-regular fa-eye" id="toggle-icon"></i>
                    </button>
                </div>

                <!-- Password Strength Meter -->
                <div class="password-strength-container">
                    <div class="strength-bars">
                        <div class="bar" id="bar-1"></div>
                        <div class="bar" id="bar-2"></div>
                        <div class="bar" id="bar-3"></div>
                        <div class="bar" id="bar-4"></div>
                        <div class="bar" id="bar-5"></div>
                    </div>
                    <p class="strength-text" id="strength-text">Password must be at least 8 characters</p>
                </div>

                <!-- Terms & Conditions Checkbox -->
                <div class="terms-container">
                    <label class="remember-me terms-label">
                        <input type="checkbox" required> 
                        <span class="custom-checkbox"></span>
                        <span class="terms-text">I agree to the Zim AutoAgri <strong>Terms of Service</strong> and <strong>Privacy Policy</strong>.</span>
                    </label>
                </div>

                <!-- Create Account Button -->
                <button type="submit" class="primary-btn">Create Account</button>

            </form>

            <!-- Footer Link back to Login -->
            <div class="card-footer">
                <p>Already have an account? <a href="login.html">Sign In</a></p>
            </div>

        </div>
    </main>

    <script src="register.js"></script>
</body>
</html>
