<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login - Zim AutoAgri</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
    // If user is ALREADY logged in, respect redirect param or go to dashboard
    const token = localStorage.getItem('zaa_token');
    if (token) {
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'account.html';
        window.location.href = redirect;
    }
</script>
</head>
<body>

    <main class="login-container">
        
        <!-- The White Floating Card -->
        <div class="login-card">
            
            <!-- Logo Section (Perfectly Horizontal) -->
            <div class="brand-header">
                <div class="logo-lockup">
                    <img src="logo.png" alt="Zim AutoAgri Logo" class="logo-img">
                    <h2>Zim AutoAgri</h2>
                </div>
                <p>Vehicles, Machinery & Agriculture</p>
            </div>

            <!-- Welcome Text -->
            <div class="welcome-text">
                <h1>Welcome Back</h1>
                <p>Please sign in to manage your account.</p>
            </div>

            <!-- The Login Form -->
            <form id="login-form" autocomplete="off">
                
                <!-- Email Input -->
                <div class="premium-input-group">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <div class="input-content">
                        <label>Email Address</label>
                        <input type="email" id="email-input" placeholder="example@email.com" autocomplete="off" required>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="premium-input-group">
                    <i class="fa-solid fa-key input-icon"></i>
                    <div class="input-content">
                        <label>Password</label>
                        <input type="password" id="password-input" placeholder="••••••••" autocomplete="new-password" required>
                    </div>
                    <!-- The Hide/Show Button -->
                    <button type="button" class="toggle-password" id="toggle-password">
                        <i class="fa-solid fa-lock-open" id="toggle-icon"></i> <span id="toggle-text">Show</span>
                    </button>
                </div>

                <!-- Form Options (Forgot Password / Remember Me) -->
                <div class="form-options">
                    <a href="#" class="forgot-link">Forgot your password?</a>
                    <label class="remember-me">
                        <input type="checkbox"> 
                        <span class="custom-checkbox"></span>
                        Remember me
                    </label>
                </div>

                <!-- Error Message Box -->
                <div id="error-message" style="display:none; background:#fee2e2; color:#dc2626; padding:10px 14px; border-radius:8px; font-size:13px; font-weight:600; margin-bottom:10px;"></div>

                <!-- Sign In Button -->
                <button type="submit" class="primary-btn">Sign In</button>

                <!-- Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Create Account Button — now links to register.html -->
                <button type="button" class="secondary-btn" onclick="window.location.href='register.html'">Create Account</button>

            </form>

            <!-- Secure Footer -->
            <div class="card-footer">
                <p>Need Help? <a href="#">Contact Support</a></p>
                <p class="security-text"><i class="fa-solid fa-lock"></i> Secured by Zim AutoAgri Security | © 2026 Zim AutoAgri Inc.</p>
            </div>

        </div>
    </main>

    <!-- Link to our JS file -->
    <script src="login.js"></script>
</body>
</html>
